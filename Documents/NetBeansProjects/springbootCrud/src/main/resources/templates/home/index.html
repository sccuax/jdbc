<html>
    <head>
        <title>Crud with springboot</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <!-- <link rel="stylesheet" th:href="@{/css/estilos.css}">-->
    </head>
    <body>
        
<div th:if="${error}" class="alert alert-danger">
    <p th:text="${error}"></p>
</div>
<!-- formulario -->
        <!<!-- Ingresar usuarios -->
        <h1>Gestión de Usuarios</h1>

    <!-- Formulario para agregar o actualizar usuario -->
    <form th:action="@{/guardar}" th:object="${usuario}" method="post">
        <input type="hidden" th:field="*{id}" placeholder="ID" required/>
        <input type="text" th:field="*{nombre}" placeholder="Nombre" required />
        <input type="tel" 
               th:field="*{phone}" 
               placeholder="Telefono"
               id="phone" 
               name="phone" 
               pattern="[0-9]+" 
               title="Solo números permitidos"
               oninput="this.value = this.value.replace(/[^0-9]/g, '')"
               required />
        <input type="email" th:field="*{email}" placeholder="Email" required />
        
        <button type="submit">Guardar</button>
    </form>

    <hr>
        <!<!-- ver informacion usuarios -->
        <hr>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.id}">1</td>
                <td th:text="${u.nombre}">Nombre</td>
                <td th:text="${u.phone}">Telefono</td>
                <td th:text="${u.email}">Correo</td>
                <td>
                    <a th:href="@{'/editar/' + ${u.id}}">Editar</a>
                    <a th:href="@{'/eliminar/' + ${u.id}}" onclick="return confirm('¿Estás seguro?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
        <style>
body {
    font-family: Arial, sans-serif;
    margin: 40px;
    background-color: #f9f9f9;
    color: #333;
}

h1, h2 {
    color: #2c3e50;
}

form {
    background-color: #ffffff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    max-width: 400px;
    margin-bottom: 40px;
}

label {
    font-weight: bold;
}

input[type="text"],
input[type="number"],
input[type="email"],
input[type="tel"]
{
    width: 100%;
    padding: 8px;
    margin-top: 4px;
    margin-bottom: 16px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
}

button {
    background-color: #3498db;
    color: white;
    padding: 10px 15px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

button:hover {
    background-color: #2980b9;
}

table {
    width: 100%;
    border-collapse: collapse;
    background-color: #ffffff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

table th, table td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #ddd;
}

table th {
    background-color: #f4f4f4;
}


        </style>
    </body>
</html>
